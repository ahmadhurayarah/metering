<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Scraper Extension</title>
    <link href="css/style.css" rel="stylesheet" />
</head>
<body>
    <div id="maincontent">
        <div>
            <h2>Lead Scraper</h2>
            <p class="description">Extract business leads directly from Google Maps to CSV or Excel.</p>
        </div>
        
        <div class="input-group">
            <label for="profileid">Search Query</label>
            <input type="text" id="profileid" value="real estate agents in miami" placeholder="e.g. plumbers in london" />
        </div>
        
        <button id="addprofilebtn">Search Google Maps</button>
    </div>
    
    <script src="js/popup.js"></script>
</body>
</html>
